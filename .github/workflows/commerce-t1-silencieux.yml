name: COMMERCE-T1 · Quatre rushs, rendu silencieux
on:
  push:
    branches: [feat/commerce-t1-silencieux]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  montage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: templates/commerce/commerce-t1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Outils du runner hébergé
        run: |
          pip install 'numpy<2.3' 'opencv-python-headless<4.13' pillow jsonschema 'imageio-ffmpeg==0.6.0'
          mkdir -p "$RUNNER_TEMP/video-tools"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/video-tools/ffmpeg"
          npm install --prefix "$RUNNER_TEMP/video-tools" --ignore-scripts --no-audit --no-fund @ffprobe-installer/linux-x64@5.2.0
          ln -s "$RUNNER_TEMP/video-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/video-tools/ffprobe"
          chmod +x "$RUNNER_TEMP/video-tools/ffprobe"
          echo "$RUNNER_TEMP/video-tools" >> "$GITHUB_PATH"
      - name: Vérifier formulaire et liaisons
        run: python tests/controle_liaisons.py
      - name: Télécharger et verrouiller les quatre rushs réels
        run: python fixtures/rushs/telecharger.py
      - name: Monter les prises avec les huit motifs
        run: python engine/rendre.py fixtures/rushs "$RUNNER_TEMP/master"
      - name: Décoder et contrôler le MP4
        run: python tests/qc_mp4.py "$RUNNER_TEMP/master"
      - uses: actions/upload-artifact@v4
        with:
          name: COMMERCE-T1-sans-voix-${{ github.run_number }}
          path: ${{ runner.temp }}/master/
          retention-days: 60
          if-no-files-found: error
